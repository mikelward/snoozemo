name: gradle-update

# One batched Gradle dependency PR per week, produced by the shared
# mikelward/gradle-update workflow: every gradle/libs.versions.toml entry
# moves to the newest stable release within its current major, the checks
# below validate the batch, and a passing batch lands by auto-merge. All
# policy lives in the shared workflow; this caller owns only the schedule
# and the permission grant, which the called workflow downscopes per job —
# the job that runs Gradle only ever sees contents: read.
#
# The @main reference is deliberate, not an unpinned third-party action:
# gradle-update is this owner's repo, its main only moves through its own
# gated pull requests (CI + automated review, no direct pushes), and the
# whole point of the shared workflow is that a fix there reaches every
# consumer's next run with no per-repo bump PRs — the drift those bumps
# reintroduce is what the shared repo exists to kill. A SHA pin here would
# also pin less than it appears to: the workflow checks its engine out at
# main by design, so the moving piece would move regardless.
on:
  schedule:
    - cron: '17 6 * * 6'   # Saturdays, off the congested top of the hour
  workflow_dispatch:
permissions: {}
concurrency:
  group: gradle-update
  cancel-in-progress: false
jobs:
  update:
    uses: mikelward/gradle-update/.github/workflows/gradle-update.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    secrets:
      # See docs/PAT.md in mikelward/gradle-update: takes priority over the
      # App credential below (simpler one-time setup while this repo is
      # single-owner — see that repo's TODO.md "Reconsider later"). Both
      # open the PR as a real collaborator either way, so CI starts on it
      # normally — no first-time-contributor approval to click through.
      token: ${{ secrets.GRADLE_UPDATE_PAT }}
      app-id: ${{ secrets.GRADLE_UPDATE_APP_ID }}
      app-private-key: ${{ secrets.GRADLE_UPDATE_APP_PRIVATE_KEY }}
    with:
      # The default is `./gradlew test` + `./gradlew lint`. Both are kept, but
      # the checkout has to come first: settings.gradle.kts includes
      # mikelward/androidlog as a composite build and fails evaluation without
      # it, and this job's clean workspace runs neither ci.yml's checkout step
      # nor the session-start hook. Without this the weekly batch would die
      # before reading a single dependency, and the only symptom would be a
      # dependency PR that silently stopped arriving.
      #
      # A clone rather than actions/checkout because `checks` is a command
      # list, not a step list. Depth 1 of the default branch, matching what
      # ci.yml and the hook take.
      checks: |
        git clone --depth 1 https://github.com/mikelward/androidlog .androidlog
        ./gradlew test
        ./gradlew lint
