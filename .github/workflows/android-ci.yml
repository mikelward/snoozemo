name: Android CI

# Adapted from the sibling Simmo and Type Launcher repos, trimmed to what this
# repo can actually run today: build + unit tests + lint. The screenshot job
# arrives with the first real UI (TODO.md Phase 2/4) and the deploy job with the
# release plumbing (Phase 6) — an empty allow-list or a release with no signing
# config would only be a red check nobody reads.

on:
  pull_request:
    # Skip CI when every changed path is housekeeping with no effect on the app
    # build: markdown docs, or root dotfiles/dotdirs — with
    # `.github/workflows/**` re-included so workflow edits validate themselves.
    # `paths` is an allow-list: patterns apply in order, last match wins per
    # file; a push runs when at least one changed file survives as included.
    paths:
      - '**'
      - '!**/*.md'
      - '!.*'
      - '!.*/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**/*.md'
      - '!.*'
      - '!.*/**'
      - '.github/workflows/**'

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    # Fail fast if a test deadlocks instead of burning the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      # Used by "Print failing test details" to post a comment on the
      # originating PR when `./gradlew test` fails.
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # versionCode is the commit count (app/build.gradle.kts), so a shallow
          # clone would silently produce a lower number than the real build.
          fetch-depth: 0
          # Don't leave the job's (pull-requests: write) token in .git/config
          # while Gradle runs PR-controlled build code; the one step that posts
          # to the PR gets the token via its own env instead.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5
        with:
          # A malicious PR commit can poison its own branch's cache; lock PRs to
          # read-only so only main pushes write the shared cache.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Check the core module stays free of Android
        # :core is a plain Kotlin JVM module on purpose (SPEC.md §11) — the state
        # machine must stay testable with no Android SDK and no Robolectric.
        #
        # `:core:test` alone does not prove that: this runner has an Android SDK,
        # so converting :core to an Android library would leave its tests green
        # and the boundary quietly gone. `verifyNoAndroid` is the actual
        # enforcement — it fails when an Android plugin or artifact enters the
        # module — and the tests run behind it.
        run: ./gradlew :core:verifyNoAndroid :core:test

      - name: Build debug APKs
        # Both flavors: `play` is the shipping build and `direct` is the
        # sideload fallback, and a change that compiles in one can break the
        # other (SPEC.md §3.4).
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew test

      - name: Print failing test details
        # When `gradlew test` fails the JUnit XML still contains the failure
        # messages and stack traces. Dump them to the job log AND, on a PR
        # build, post them as a PR comment so the same data is reachable
        # without opening the job log or unzipping the artifact.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_NAME: ${{ github.job }}
        run: |
          shopt -s nullglob globstar
          summary=""
          for xml in **/build/test-results/**/TEST-*.xml; do
            if grep -q "<\(failure\|error\)" "$xml"; then
              echo "::group::$xml"
              cat "$xml"
              echo "::endgroup::"
              summary+=$'\n\n'"### \`$xml\`"$'\n```xml\n'"$(cat "$xml")"$'\n```'
            fi
          done
          if [ -n "$PR_NUMBER" ] && [ -n "$summary" ]; then
            body=$'<!-- ci-failure -->'$'\n'"**${JOB_NAME} failed.** Failing test reports:"$'\n'"$summary"
            # GitHub rejects comments over 65536 characters, and a wide failure
            # can produce more XML than that. Trim to fit rather than losing the
            # whole comment; the artifact still has everything.
            if [ "${#body}" -gt 60000 ]; then
              body="${body:0:60000}"$'\n```\n\n_Truncated — the full reports are in the `unit-test-reports` artifact._'
            fi
            # --fail-with-body, not a bare `curl -sS`: a 4xx/5xx (missing write
            # permission, an over-long body) otherwise exits 0 and the comment
            # silently never appears. That matters more here than usual, because
            # AGENTS.md reads "no PR comment" as evidence the failure happened
            # *before* the tests ran — so a dropped comment doesn't just lose
            # data, it points the next reader at the wrong stage.
            if ! curl -sS --fail-with-body -o /tmp/pr-comment-response.json -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d "$(jq -n --arg body "$body" '{body:$body}')"; then
              echo "::warning::Could not post the failing-test comment; the reports are in the job log above and in the unit-test-reports artifact."
              cat /tmp/pr-comment-response.json
            fi
          fi

      - name: Upload unit test reports
        # Always upload so a failed run leaves the JUnit XMLs and HTML reports
        # for inspection. An artifact that exists but holds no XML means the
        # failure was earlier than the tests.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Run lint
        run: ./gradlew lint
