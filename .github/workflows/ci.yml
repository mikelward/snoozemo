name: ci

# Adapted from the sibling Simmo and Type Launcher repos. The `deploy` job below
# is Phase 6's release plumbing (TODO.md, `docs/play-store-internal-track.md`):
# a signed AAB built on every push to `main`, published as a downloadable
# workflow artifact for the one-time manual seed upload Play requires, and —
# once `PLAY_SERVICE_ACCOUNT_JSON` is configured — uploaded automatically to
# the Play internal testing track with release notes built from the push's
# own qualifying commit subjects.

on:
  # No paths filter on pull_request, deliberately: the main ruleset requires
  # the `gate` check, and a required check that never reports blocks the PR
  # forever — which is exactly what a path-filtered-out workflow produces.
  # Housekeeping-only PRs skip the heavy jobs via `classify` instead, and
  # `gate` verifies the skip was justified (the mikelward/lanes engine,
  # policy in .github/lanes.conf, has the full design rationale).
  #
  # `edited` is load-bearing, not tidiness: a retarget changes what the
  # diff is measured against while the head — and any `gate`/`lanes` check
  # run already minted on it — stays exactly where it was, so a base
  # change has to start a fresh run or the old verdict simply stands.
  # Title and body edits re-run the lane too, deliberately: a skipped job
  # would be worse than a redundant one, since GitHub counts a SKIPPED
  # required check as satisfied.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Exists for exactly one caller: the screenshot job's refresh step, whose
  # `ci: refresh recorded screenshots` push is made with `GITHUB_TOKEN` and
  # therefore starts no workflow run on its own (GitHub's loop-prevention
  # rule). A dispatch made with that same token is the documented exception,
  # so the step starts this workflow on the head it just pushed — otherwise
  # the required `gate` check would exist only on the refreshed commit's
  # parent and the PR could never satisfy branch protection. Dispatched runs
  # are non-PR events, so `classify` sends them down the code lane and every
  # heavy job runs against the refreshed head. (GitHub only dispatches
  # workflows it can see on the default branch, so this trigger becomes
  # effective once it lands on main.)
  #
  # The `pr` input is REQUIRED so a dispatched run can never produce a weaker
  # verdict than the PR run it stands in for: without it, `docs_only` would be
  # forced false, the heavy jobs would run against the branch alone, and the
  # resulting green `gate` on the head SHA could replace a red PR gate —
  # bypassing the prefix lint and the merge-ref build. With it, classify and
  # gate judge the named PR's real diff and commits, and the build checks out
  # that PR's merge ref, so the dispatched verdict is the PR verdict.
  workflow_dispatch:
    inputs:
      pr:
        description: >-
          Pull request number this run reports for. Classification, the
          prefix lint, and the build's merge-ref checkout all come from it.
        required: true
  push:
    branches:
      - main
    # Mirrors the lane's housekeeping rule (.github/lanes.conf): skip the
    # main run only when every changed file is markdown outside the module
    # trees. The later patterns re-include module paths, so a markdown build
    # input (a packaged asset can be .md) still builds; dotfiles are no
    # longer excluded — .gitignore and workflow edits are code.
    paths:
      - '**'
      - '!**/*.md'
      - 'app/**'
      - 'core/**'
      - 'dnd/**'
      - 'presence/**'
      - 'tile/**'
      - '.github/workflows/**'

# Explicitly empty, not omitted: every job below declares its own downscoped
# block, so this grants nothing itself — it exists so a future job that
# forgets its own block gets no ambient token instead of silently inheriting
# the repository's default GITHUB_TOKEN permission.
permissions: {}

jobs:
  # Decides whether the heavy jobs may skip: true only when every changed
  # file in the PR is housekeeping under .github/lanes.conf (the
  # mikelward/lanes engine). Pushes to main are always classified as code,
  # so they run everything; a dispatched run classifies the PR its required
  # `pr` input names, exactly as the PR run would.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      # Only consumed by `gate`/`lanes`'s dispatch-binding check below — the
      # heavy jobs' own skip decision comes from `docs_only` above.
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - name: Classify
        id: lane
        uses: mikelward/lanes@main
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number || inputs.pr }}

  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    # Fail fast if a test deadlocks instead of burning the 6-hour default.
    timeout-minutes: 30
    env:
      # Presence only, never the value. The release-APK step below skips on main
      # only when `deploy` will really build the AAB, and deploy's build is itself
      # gated on this secret -- so without it, neither job would build a release
      # variant and R8 would stop running anywhere. See that step's comment.
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    permissions:
      contents: read
      # Used by "Print failing test details" to post a comment on the
      # originating PR when `./gradlew test` fails.
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # versionCode is the commit count (app/build.gradle.kts), so a shallow
          # clone would silently produce a lower number than the real build.
          fetch-depth: 0
          # A dispatched run builds the same thing the PR run would have: the
          # named PR's merge ref, not the bare branch — otherwise a dispatch
          # could green the gate without ever compiling the PR-merged tree.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || '' }}
          # Don't leave the job's (pull-requests: write) token in .git/config
          # while Gradle runs PR-controlled build code; the one step that posts
          # to the PR gets the token via its own env instead.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5
        with:
          # A malicious PR commit can poison its own branch's cache, and a
          # dispatched run executes the same PR-controlled code — so the write
          # grant is an allowlist, not a denylist: only pushes to main write
          # the shared cache.
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Check the core module stays free of Android
        # :core is a plain Kotlin JVM module on purpose (SPEC.md §11) — the state
        # machine must stay testable with no Android SDK and no Robolectric.
        #
        # `:core:test` alone does not prove that: this runner has an Android SDK,
        # so converting :core to an Android library would leave its tests green
        # and the boundary quietly gone. `verifyNoAndroid` is the actual
        # enforcement — it fails when an Android plugin or artifact enters the
        # module — and the tests run behind it.
        run: ./gradlew :core:verifyNoAndroid :core:test

      - name: Build debug APKs
        # Both flavors: `play` is the shipping build and `direct` is the
        # sideload fallback, and a change that compiles in one can break the
        # other (SPEC.md §3.4).
        run: ./gradlew assembleDebug

      - name: Build release APKs
        # The only R8 coverage this repo has, and the reason the debug step
        # above does not carry any: AGP disables optimization and obfuscation
        # for debuggable builds outright, so a minified debug APK runs the
        # shrinker and nothing else. Everything that can actually go wrong under
        # R8 -- code stripped, or renamed out from under a reflective lookup --
        # and everything Play's 2027 threshold measures (SPEC.md §3.7) lives in
        # these two variants. Without this step the post-merge deploy would be
        # the first build to run the code Play receives. Unsigned, since
        # RELEASE_KEYSTORE_FILE is unset outside deploy; signing is not what
        # this step checks.
        run: ./gradlew assembleRelease

      - name: Check licenses exports are up to date
        # The open-source attribution lists are committed to res/raw, one per
        # flavor (AGP 9 can't auto-generate them into the app -- see
        # app/build.gradle.kts). Regenerate and fail on drift so a dependency
        # bump can't ship a stale or inaccurate Licenses page while CI stays
        # green -- including the case where a new dependency lands in only one
        # flavor.
        run: |
          ./gradlew :app:exportBundledLicenses --rerun
          git diff --exit-code app/src/play/res/raw/aboutlibraries.json app/src/direct/res/raw/aboutlibraries.json

      - name: Run unit tests
        run: ./gradlew test

      - name: Print failing test details
        # When `gradlew test` fails the JUnit XML still contains the failure
        # messages and stack traces. Dump them to the job log AND, on a PR
        # build, post them as a PR comment so the same data is reachable
        # without opening the job log or unzipping the artifact.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `inputs.pr` so a dispatched run's test failure still posts the
          # failing-tests comment — its absence is documented as meaning "the
          # failure happened before tests", which would misdirect diagnosis.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          JOB_NAME: ${{ github.job }}
        run: |
          shopt -s nullglob globstar
          summary=""
          for xml in **/build/test-results/**/TEST-*.xml; do
            if grep -q "<\(failure\|error\)" "$xml"; then
              echo "::group::$xml"
              cat "$xml"
              echo "::endgroup::"
              summary+=$'\n\n'"### \`$xml\`"$'\n```xml\n'"$(cat "$xml")"$'\n```'
            fi
          done
          if [ -n "$PR_NUMBER" ] && [ -n "$summary" ]; then
            body=$'<!-- ci-failure -->'$'\n'"**${JOB_NAME} failed.** Failing test reports:"$'\n'"$summary"
            # GitHub rejects comments over 65536 characters, and a wide failure
            # can produce more XML than that. Trim to fit rather than losing the
            # whole comment; the artifact still has everything.
            if [ "${#body}" -gt 60000 ]; then
              body="${body:0:60000}"$'\n```\n\n_Truncated — the full reports are in the `unit-test-reports` artifact._'
            fi
            # `gh api`, not `curl`: it exits non-zero on a 4xx/5xx and prints
            # the response itself, where a bare `curl -sS` exits 0 and the
            # comment silently never appears. That matters more here than
            # usual, because AGENTS.md reads "no PR comment" as evidence the
            # failure happened *before* the tests ran — so a dropped comment
            # doesn't just lose data, it points the next reader at the wrong
            # stage. Raising the warning is still ours to do: the step runs
            # under `if: failure()`, so the job is already red and what a
            # reader needs is a line saying where the reports went.
            if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$body" > /dev/null; then
              echo "::warning::Could not post the failing-test comment; the reports are in the job log above and in the unit-test-reports artifact."
            fi
          fi

      - name: Upload unit test reports
        # Always upload so a failed run leaves the JUnit XMLs and HTML reports
        # for inspection. An artifact that exists but holds no XML means the
        # failure was earlier than the tests.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Run lint
        run: ./gradlew lint

      - name: Verify the release version guard
        # The guard (`checkReleaseVersionDerivation`, app/build.gradle.kts) is
        # Gradle wiring with no unit-test harness — a TestKit fixture would be a
        # whole new test infrastructure for one task — so CI proves the three
        # things a regression could silently undo: the task is still in every
        # release variant's graph (an AGP rename of the `pre*ReleaseBuild`
        # anchor would unwire it without failing anything), it passes on this
        # full-depth checkout, and it refuses a shallow clone for the stated
        # reason, not incidentally.
        #
        # Last in the job on purpose: the step fakes a shallow clone by writing
        # `.git/shallow`, and the trap puts the tree right even when the
        # expected failure isn't the one that happens.
        run: |
          ./gradlew -q :app:prePlayReleaseBuild :app:preDirectReleaseBuild --dry-run | tee /tmp/release-task-graph.txt
          grep -q ':app:checkReleaseVersionDerivation' /tmp/release-task-graph.txt
          ./gradlew :app:checkReleaseVersionDerivation
          trap 'rm -f .git/shallow' EXIT
          git rev-parse HEAD > .git/shallow
          if out=$(./gradlew :app:checkReleaseVersionDerivation 2>&1); then
            echo "$out"
            echo "::error::The release guard passed on a shallow clone."
            exit 1
          fi
          echo "$out" | grep -q "Refusing to build a release"

  screenshot-tests:
    name: Screenshot tests
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    timeout-minutes: 30
    permissions:
      # Read-only: this job now only renders and uploads an artifact. The
      # commit-back and dispatch this job used to do (and the write/actions
      # grants that needed) moved to `sync-screenshots` below, which never
      # executes anything from the PR — see mikelward/ci-commit-artifact's
      # README for why that separation is the actual fix, not a hardened
      # version of doing it here.
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          # Same-repo PRs check out the head *branch* rather than
          # refs/pull/N/merge, matching what `sync-screenshots` below pushes
          # to (`branch-ref`) — rendering against the same content that a
          # refresh commit would land on, not a merge snapshot it never
          # touches. The build job still runs the assertions against the
          # merge ref.
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
          # This job holds no write credential to begin with (contents: read
          # above), but false anyway — nothing here should assume otherwise
          # just because the checkout step's default happens to agree today.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5
        with:
          # Same allowlist as the build job: only pushes to main write.
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Clear committed snapshots before recording
        # Recording only overwrites files the suites still produce, so starting
        # from empty is what makes a deleted test show up as a deletion in the
        # refresh commit instead of a stale PNG living in the repo forever.
        run: |
          rm -rf app/src/test/snapshots/images
          mkdir -p app/src/test/snapshots/images
          # The store graphics record outside the snapshot tree, so they need
          # clearing too -- otherwise a renamed or dropped output stays
          # committed and the staleness check below reads it as clean. By name
          # rather than a glob: the store screenshots will live in that
          # directory too (TODO.md) and are authored assets nothing here
          # regenerates, as is the README beside them.
          rm -f docs/play-store/icon-512.png docs/play-store/feature-graphic.png

      # One step per screenshot class, and the allow-list is deliberate: a new
      # *ScreenshotTest that isn't listed here records nothing in CI even though
      # it passes, so its snapshots would silently never exist.
      #
      # The `play` flavor only. The screens are flavor-agnostic — the split is
      # below `PresenceMonitor` (SPEC.md §3.4) — so recording both would render
      # identical pixels twice and race to write the same files.
      - name: Run main screen screenshot tests
        run: ./gradlew :app:testPlayDebugUnitTest --tests "app.snoozemo.ui.MainScreenScreenshotTest" -Proborazzi.test.record=true

      - name: Run permissions screen screenshot tests
        run: ./gradlew :app:testPlayDebugUnitTest --tests "app.snoozemo.ui.PermissionsScreenScreenshotTest" -Proborazzi.test.record=true

      - name: Run settings screen screenshot tests
        run: ./gradlew :app:testPlayDebugUnitTest --tests "app.snoozemo.ui.SettingsScreenScreenshotTest" -Proborazzi.test.record=true

      - name: Run licenses screen screenshot tests
        # Records the `play` flavor's attribution list, from that flavor's own
        # committed res/raw/aboutlibraries.json — so the baseline moves
        # whenever what the Play build bundles does. `direct`'s list is a
        # strict subset and is covered by the export drift check in `build`.
        run: ./gradlew :app:testPlayDebugUnitTest --tests "app.snoozemo.ui.LicensesScreenScreenshotTest" -Proborazzi.test.record=true

      - name: Run end-condition sheet screenshot tests
        run: ./gradlew :app:testPlayDebugUnitTest --tests "app.snoozemo.ui.EndConditionSheetScreenshotTest" -Proborazzi.test.record=true

      - name: Run edge-to-edge screenshot tests
        run: ./gradlew :app:testPlayDebugUnitTest --tests "app.snoozemo.ui.EdgeToEdgeScreenshotTest" -Proborazzi.test.record=true

      - name: Run tile mark screenshot tests
        run: ./gradlew :app:testPlayDebugUnitTest --tests "app.snoozemo.ui.TileMarkScreenshotTest" -Proborazzi.test.record=true

      - name: Run launcher icon screenshot tests
        run: ./gradlew :app:testPlayDebugUnitTest --tests "app.snoozemo.ui.LauncherIconScreenshotTest" -Proborazzi.test.record=true

      # The Play Store graphics are recorded like a screenshot, into
      # docs/play-store/ rather than the snapshot tree, so this step is what
      # keeps them from going stale after a launcher-drawable edit.
      - name: Run Play Store graphics tests
        run: ./gradlew :app:testPlayDebugUnitTest --tests "app.snoozemo.ui.PlayStoreGraphicsScreenshotTest" -Proborazzi.test.record=true

      - name: Print failing test details
        if: failure()
        run: |
          shopt -s nullglob globstar
          for xml in app/build/test-results/**/TEST-*.xml; do
            if grep -q "<\(failure\|error\)" "$xml"; then
              echo "::group::$xml"
              cat "$xml"
              echo "::endgroup::"
            fi
          done

      - name: Fail on screenshot drift when a refresh cannot be pushed
        # Fork PRs and pushes to main can't receive a refresh commit, so drift
        # has to fail the job loudly there rather than hide in an artifact under
        # a green check.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [ -n "$(git status --porcelain -- app/src/test/snapshots/images)" ]; then
            git status --porcelain -- app/src/test/snapshots/images
            echo "::error::Recorded screenshots differ from the committed ones; re-record and commit them."
            exit 1
          fi

      - name: Fail on stale Play Store graphics
        # Unlike the UI snapshots above, these are not covered by
        # `sync-screenshots`: it commits one artifact into one dest-path, and
        # widening that is a change to a shared, deliberately narrow fork-safe
        # mechanism rather than a change to this repo. So drift here fails on
        # every event, including a same-repo PR, and is re-recorded by hand:
        #   ./gradlew :app:testPlayDebugUnitTest \
        #     --tests "app.snoozemo.ui.PlayStoreGraphicsScreenshotTest" \
        #     -Proborazzi.test.record=true
        run: |
          if [ -n "$(git status --porcelain -- docs/play-store)" ]; then
            git status --porcelain -- docs/play-store
            echo "::error::The Play Store graphics are stale — re-record and commit them."
            exit 1
          fi

      - name: Upload Roborazzi screenshots
        # Unconditional: a job that died before any test ran still uploads an
        # empty directory, and that emptiness is itself the diagnosis. This is
        # also `sync-screenshots`' own input below — the only thing it ever
        # sees of this job's render, never anything else this job touched.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: roborazzi-screenshots
          path: app/src/test/snapshots/images/
          if-no-files-found: ignore

      - name: Upload screenshot test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: screenshot-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 1

  # Pushes any drift in `screenshot-tests`' regenerated screenshots back to a
  # same-repo PR branch. Delegated to mikelward/ci-commit-artifact's reusable
  # workflow, rather than inline in `screenshot-tests` the way this repo used
  # to do it, specifically so the commit/push never shares a job with the PR's
  # own Gradle code — see that repo's README for the structural reasoning
  # (`docs/fork-safe-ci.md` has the full migration this is milestone 1 of).
  #
  # dispatch-workflow, not push-token: this repo still runs plain
  # `pull_request`, where ci-commit-artifact's own validation treats a
  # GITHUB_TOKEN push + dispatch as safe (the workflow file that runs is
  # already the PR branch's own copy, so dispatching onto it grants no new
  # trust). push-token is milestone 2, once CI_COMMIT_ARTIFACT_TOKEN exists.
  #
  # The @main reference is deliberate: this account's own repo, gated behind
  # its own CI and Codex review rather than direct pushes to main, and the
  # whole point of a shared reusable workflow is that a fix there reaches
  # every consumer's next run without a per-repo bump PR.
  sync-screenshots:
    name: Sync recorded screenshots
    needs: [classify, screenshot-tests]
    # Same-repo PRs only — fork branches aren't pushable with this token, and
    # pushing to main directly from CI is not this job's purpose. No explicit
    # status-check function needed on the repo/event check: the bare `needs:`
    # already implies `success()`, so this is also skipped whenever
    # `screenshot-tests` itself failed or was skipped (docs-only PRs).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: mikelward/ci-commit-artifact/.github/workflows/commit-artifact.yml@main
    # All three are required by GitHub's own static check at call time, not
    # by what this call actually exercises: the called workflow's `commit`
    # job declares `contents: write, pull-requests: write, actions: write`,
    # and GitHub refuses to even start a run whose caller grants less than
    # the callee's own job block requests — a real "startup_failure" this PR
    # hit, unrelated to comment-marker being unset here (verified live: the
    # error names line/col and says so explicitly, not something the plan
    # doc anticipated). pull-requests: write is dead weight for what this
    # call actually does, kept only because the platform demands it.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      artifact-name: roborazzi-screenshots
      dest-path: app/src/test/snapshots/images
      commit-message: 'ci: refresh recorded screenshots'
      branch-ref: ${{ github.event.pull_request.head.ref }}
      # The tested SHA, not the branch name: the artifact was rendered
      # against this specific commit, and expected-head-sha is what lets the
      # hub workflow tell a genuine lost race (branch-ref advanced past this
      # since) apart from an ordinary no-op — see that workflow's own README.
      expected-head-sha: ${{ github.event.pull_request.head.sha }}
      # comment-marker stays unset ('', the default): this repo posts its own
      # richer visual diff comment instead (post-screenshot-diff below), not
      # the hub's plain status line.
      dispatch-workflow: ci.yml
      pr-number: ${{ github.event.pull_request.number }}

  # Embeds every snapshot this PR adds, removes, or changes, pinned to commit
  # SHAs, into a single auto-updated PR comment (marker: <!-- screenshot-diff
  # -->) so reviewers see the visual delta inline without downloading the
  # artifact. Split out of `screenshot-tests`/`sync-screenshots` into its own
  # job because a reusable-workflow job (`sync-screenshots` above) can't carry
  # extra steps of its own.
  post-screenshot-diff:
    name: Post screenshot diffs as a PR comment
    runs-on: ubuntu-latest
    needs: [sync-screenshots]
    # Same-repo-PR-ness is already implied here: sync-screenshots only
    # reaches `success` (rather than being skipped) on that path, per its own
    # `if:` above.
    if: needs.sync-screenshots.result == 'success'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          # The hub workflow's own authoritative result — the resulting head
          # of branch-ref after it ran, whether or not it actually pushed —
          # never a commit made locally in this job (there isn't one) or one
          # that might not have actually landed. Diffing against anything
          # else risks pinning an image URL to a SHA the branch was never
          # actually at.
          ref: ${{ needs.sync-screenshots.outputs.commit-sha }}
          persist-credentials: false

      - name: Post screenshot diffs as a PR comment
        # GitHub renders "Binary files not rendered" for PNG diffs in the mobile
        # app, so the Files tab is not a review surface for snapshots; embedded
        # images are. Never gates the job.
        #
        # Embeds go through github.com/<repo>/raw/<sha>/… rather than
        # raw.githubusercontent.com: that CDN origin never sees a github.com
        # session cookie, so every embed 404s once the repo is private.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")
          HEAD_SHA=$(git rev-parse HEAD)
          # Deletions count. A removed or renamed screenshot test is a *change
          # to the UI record* with no after-image, and the step that clears the
          # directory before recording makes it a reachable state rather than a
          # theoretical one. Left out, a reviewer sees no trace of a state the
          # app used to have.
          # --no-renames, or a snapshot renamed without a pixel changing is
          # emitted as `R100<TAB>old<TAB>new`, which this filter drops — and a
          # rename-only PR would then report itself as having no screenshot
          # changes at all. With it, the same rename arrives as a deletion plus
          # an addition, which is also the truthful thing to show a reviewer.
          mapfile -t entries < <(git diff --no-renames --name-status "$BASE_SHA" HEAD -- app/src/test/snapshots/images/ | grep -E '^[AMD]' || true)
          raw="https://github.com/${GITHUB_REPOSITORY}/raw"
          files="https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}/files"
          if [ ${#entries[@]} -eq 0 ]; then
            # Not an early exit. A PR that *had* screenshot changes and no
            # longer does already has a comment full of images that are no
            # longer in the diff, and leaving it there is worse than never
            # having posted: it shows a UI state this branch does not produce.
            # So fall through with a body that says so, and post it only if
            # there is an existing comment to correct (below).
            echo "No screenshot changes vs merge-base."
            body="<!-- screenshot-diff -->"$'\n'"## Screenshot diffs"$'\n\n'"No screenshot changes on this PR as of \`${HEAD_SHA:0:7}\`."
          else
          body="<!-- screenshot-diff -->"$'\n'"## Screenshot diffs"$'\n\n'"Auto-posted by CI. Images pinned to \`${HEAD_SHA:0:7}\`; each caption opens the diff."$'\n'
          # A fixed item count either truncates real changes well below
          # GitHub's actual comment limit or, picked generously, still lets a
          # handful of oversized entries blow past it — the limit that
          # matters is GitHub's, not a headcount. So budget characters
          # instead: keep adding entries until the next one would push the
          # comment past 60000 (the same margin below GitHub's 65536-char
          # cap this file already uses for the failing-tests comment above),
          # and only then say so.
          shown=0
          truncated=0
          for entry in "${entries[@]}"; do
            status="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            name=$(basename "$path")
            # GitHub anchors a file in the Files changed tab by the sha256 of its path.
            anchor=$(printf '%s' "$path" | sha256sum | cut -d' ' -f1)
            case "$status" in
              A)
                chunk=$'\n'"**Added — [\`${name}\`](${files}#diff-${anchor})**"$'\n\n'"<img src=\"${raw}/${HEAD_SHA}/${path}\" width=\"320\">"$'\n'
                ;;
              D)
                # Before-image only: there is no after. Pinned to the merge
                # base, which is the last commit that still had the file.
                chunk=$'\n'"**Removed — [\`${name}\`](${files}#diff-${anchor})**"$'\n\n'"<img src=\"${raw}/${BASE_SHA}/${path}\" width=\"320\">"$'\n'
                ;;
              *)
                chunk=$'\n'"**Changed — [\`${name}\`](${files}#diff-${anchor})**"$'\n\n'"| Before | After |"$'\n'"| --- | --- |"$'\n'"| <img src=\"${raw}/${BASE_SHA}/${path}\" width=\"320\"> | <img src=\"${raw}/${HEAD_SHA}/${path}\" width=\"320\"> |"$'\n'
                ;;
            esac
            if [ $(( ${#body} + ${#chunk} )) -gt 60000 ]; then
              truncated=1
              break
            fi
            body+="$chunk"
            shown=$((shown+1))
          done
          if [ "$truncated" -eq 1 ]; then
            body+=$'\n'"_…truncated: showing $shown of ${#entries[@]} changed screenshots (comment near GitHub's size limit)._"
          fi
          fi
          # The lookup must skip rather than guess. Its result picks
          # update-vs-create, so an error swallowed into an empty id doesn't
          # lose the comment — it posts a *duplicate*, and every later run
          # duplicates again. `gh api` exits non-zero on both an HTTP error and
          # a body jq can't parse, which is exactly the pair a hand-rolled
          # `curl | jq` had to check separately.
          #
          # --paginate for the same reason: past 100 comments the marker falls
          # off page one, which produces that same duplicate from a different
          # cause. The jq filter runs per page, so this takes the first id
          # rather than indexing into one page's array.
          if ! ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select((.body // "") | startswith("<!-- screenshot-diff -->")) | .id'); then
            echo "::warning::Could not list PR comments; skipping the screenshot-diff comment rather than risking a duplicate. The snapshots are in the roborazzi-screenshots artifact."
            exit 0
          fi
          existing="${ids%%$'\n'*}"
          if [ -n "$existing" ]; then
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -f body="$body" > /dev/null; then
              echo "Updated screenshot-diff comment ${existing}."
            else
              echo "::warning::Could not update screenshot-diff comment ${existing}; the snapshots are in the roborazzi-screenshots artifact."
            fi
          elif [ ${#entries[@]} -eq 0 ]; then
            # Nothing to show and no stale comment to correct.
            echo "No screenshot changes and no existing comment; nothing to post."
          else
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$body" > /dev/null; then
              echo "Posted new screenshot-diff comment."
            else
              echo "::warning::Could not post the screenshot-diff comment; the snapshots are in the roborazzi-screenshots artifact."
            fi
          fi

  # The one check the main ruleset requires today. Always runs, always
  # reports — green only when every heavy job succeeded, or when they were
  # skipped and the skip is INDEPENDENTLY verified as justified: the diff
  # re-derived as housekeeping-only and every commit subject carrying a
  # housekeeping prefix. Any other combination — a failure anywhere, a skip
  # on a code diff, classify itself failing — is an explicit red, never a
  # silent pass.
  #
  # TEMPORARY, alongside `lanes` below: mikelward/lanes renamed its
  # consumer-facing check from `gate` to `lanes` (mikelward/lanes#9), and
  # the ruleset here still requires `gate`. Per that PR's staged-rename
  # procedure (README.md "Renaming an existing consumer's check"), this
  # duplicate keeps `gate` reporting until the ruleset is flipped to
  # require `lanes` instead — then this job is deleted.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, build, screenshot-tests, sync-screenshots]
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - name: Verdict
        uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run — the base classify recorded
          # before the heavy jobs ran; a pull_request run takes the same
          # commit from its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          # `sync` folds "skipped because this run can't sync" into
          # "success": mikelward/lanes' gate() requires every named result to
          # be uniformly success or uniformly skipped (lanes.mjs's
          # parseResults/gate), and sync-screenshots is *expected* to skip on
          # a fork PR or a push to main while build/screenshots succeed —
          # left unfolded, that mix reads as "not all green, and not a
          # justified skip" and fails every such run, including every push
          # to main. A skip that instead means screenshot-tests itself was
          # skipped (the docs-only path) is left alone, so it still lines up
          # with build/screenshots also reading skipped there rather than
          # breaking that path's own all-skipped justification instead.
          results: >-
            build=${{ needs.build.result }}
            screenshots=${{ needs.screenshot-tests.result }}
            sync=${{ (needs.sync-screenshots.result == 'skipped' && needs.screenshot-tests.result == 'success') && 'success' || needs.sync-screenshots.result }}

  # The renamed check (mikelward/lanes#9) — this is what the ruleset should
  # require once it has reported at least once on a real pull_request run.
  # Identical to `gate` above; see that job's comment for why both exist
  # for now.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, build, screenshot-tests, sync-screenshots]
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - name: Verdict
        uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          classify-result: ${{ needs.classify.result }}
          base-sha: ${{ needs.classify.outputs.base_sha }}
          # `sync` folds "skipped because this run can't sync" into
          # "success": mikelward/lanes' gate() requires every named result to
          # be uniformly success or uniformly skipped (lanes.mjs's
          # parseResults/gate), and sync-screenshots is *expected* to skip on
          # a fork PR or a push to main while build/screenshots succeed —
          # left unfolded, that mix reads as "not all green, and not a
          # justified skip" and fails every such run, including every push
          # to main. A skip that instead means screenshot-tests itself was
          # skipped (the docs-only path) is left alone, so it still lines up
          # with build/screenshots also reading skipped there rather than
          # breaking that path's own all-skipped justification instead.
          results: >-
            build=${{ needs.build.result }}
            screenshots=${{ needs.screenshot-tests.result }}
            sync=${{ (needs.sync-screenshots.result == 'skipped' && needs.screenshot-tests.result == 'success') && 'success' || needs.sync-screenshots.result }}

  deploy:
    name: Build and release
    # Production build job (TODO.md Phase 6, docs/play-store-internal-track.md).
    # Builds and publishes a signed AAB for the manual seed upload Play
    # requires, and — once PLAY_SERVICE_ACCOUNT_JSON is configured — uploads
    # it to the Play internal track automatically. Gated three ways:
    #   1. `if:` — a push to main, never a PR. `workflow_dispatch` on this
    #      workflow always carries a required `pr` input tied to the
    #      screenshot-refresh flow (see the trigger comment above), so it is
    #      not a stand-in for a manual release trigger here.
    #   2. `environment: production` — the secrets below live in the
    #      `production` environment (repo Settings -> Environments →
    #      production), whose deployment branches should be restricted to
    #      `main` so the boundary is enforced by GitHub, not only by `if:`.
    #   3. `needs:` — runs only once build and screenshot-tests both pass, so
    #      a failing test or a screenshot drift on main blocks the release.
    #
    # Both secrets below are optional and every step gates on its own
    # presence, so a fresh repo or fork still gets a green run with nothing
    # built or uploaded — an empty allow-list or a release with no signing
    # config would only be a red check nobody reads.
    #
    # `concurrency` serializes every run of this job across the whole repo
    # (Codex, PR #97): without it, two pushes to `main` landing close
    # together — routine when merges happen back to back — could both reach
    # "Build release notes" before either's own Play upload finishes, so
    # both compute their range base from the same "nothing has published
    # yet" snapshot. Worst case: the newer push's upload lands first and
    # Play rejects the older push's now-lower `versionCode`; even in the
    # right order, the newer release's notes repeat subjects the older one
    # already published. `cancel-in-progress: false` queues the second run
    # rather than canceling the first — canceling mid-upload is the one
    # thing this must never do.
    concurrency:
      group: deploy-main-release
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, screenshot-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    permissions:
      contents: read
      # "Build release notes" walks recent main runs of this workflow via
      # the Actions API to find the last one that actually published, so the
      # notes cover every commit since — not just the ones in this push.
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2  # v5

      - name: Build release notes
        # Walks every commit in this push oldest-first and collects the
        # subject line of each one worth shipping as a Play "What's new"
        # entry (AGENTS.md, *Commit messages*):
        #   - skip commits whose subject starts with a non-user-facing
        #     prefix — `ci:`, `docs:`, `internal:`, `refactor:`, `test:` /
        #     `tests:`. None describe a user-visible change worth
        #     announcing.
        #   - skip commits whose every changed path is repo housekeeping —
        #     a `.md` file at any depth or any dotfile/dotdir at the repo
        #     root (`.github/`, `.claude/`, `.gitignore`, …).
        #     `docs/PRIVACY.md` is ordinary docs like the rest of `docs/`
        #     here too (AGENTS.md), so it is not special-cased the way the
        #     sibling repos' `PRIVACY.md` is — Play's "What's new" is a
        #     store-listing field a user never sees at update time, so a
        #     policy-wording change gains nothing from forcing its way in.
        # The qualifying subjects are emitted as a "• "-bulleted list,
        # oldest-first — always bulleted, even for a single qualifying
        # commit, so the Play "What's new" card always renders the same
        # shape. If no commit in the push qualifies, sets
        # RELEASE_NOTES_SKIP=true and the upload step below skips — a push
        # of only prefixed or housekeeping commits doesn't ship a redundant
        # release with no user-facing notes.
        #
        # A manual workflow_dispatch is the one exception: it's an explicit
        # "publish the current tip anyway" request, so it never sets
        # RELEASE_NOTES_SKIP — falling back to a generic note instead of
        # skipping when nothing qualifies. (This job's own `if:` only
        # allows a push today; the dispatch exception is kept anyway so a
        # future manual-release trigger doesn't need to touch this logic.)
        #
        # The range base is the head SHA of the most recent main run of
        # this workflow whose deploy job actually published — queried from
        # the Actions API. `github.event.before` is only a fallback: if a
        # prior main push failed before publishing, `before` would be that
        # failed push's tip and the next run's notes would silently omit
        # the unreleased commits from the failed range. The base must be a
        # run that actually published — its Play upload step concluded
        # success — not merely a green deploy job: with PLAY_SERVICE_ACCOUNT_JSON
        # missing, the upload step skips and the deploy job still concludes
        # success, and counting such a run as released would drop its
        # range's commits from the first real release after the secret is
        # added.
        #
        # Engineering detail lives in the commit body, which the Play card
        # never shows — see AGENTS.md's "Commit messages" section for the
        # wording convention. Play's documented per-language cap is 500
        # Unicode characters for the entered "What's new" text, so the
        # truncation budget here is measured against the full formatted
        # output — bullet ("• "), newline separators, and the "\n…"
        # truncation marker all count toward MAX. If the budget overflows
        # we drop trailing subjects (oldest-first preserved at the head)
        # until it fits and append "\n…" so the reader knows the tail was
        # cut. If a single subject alone exceeds the cap (unlikely —
        # subjects are conventionally ≤ ~70 chars) we hard-truncate the
        # bullet line to 499 chars and append "…".
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Guard against "Re-run all jobs" replaying an already-published
          # commit (Codex, PR #97): if an earlier attempt of this exact run
          # already got past the Play upload step successfully, a rerun
          # would otherwise skip past its own head SHA in the walk below
          # (see "The current run ... are skipped"), recompute the same
          # notes, and try to upload the identical AAB again — Play rejects
          # that outright on the reused versionCode, turning an
          # idempotent-looking rerun red for no reason. GITHUB_RUN_ID and
          # GITHUB_RUN_ATTEMPT are both default Actions env vars, present
          # without declaring them above.
          if [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]; then
            attempt=1
            while [ "$attempt" -lt "${GITHUB_RUN_ATTEMPT}" ]; do
              published=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${attempt}/jobs?per_page=100" \
                --jq '[.jobs[]
                       | select(.name == "Build and release")
                       | .steps[]
                       | select(.name == "Upload to Play Store internal track")
                       | .conclusion]
                      | any(. == "success")' \
                2>/dev/null || true)
              if [ "$published" = "true" ]; then
                echo "This commit already published successfully in attempt ${attempt} of this same run; skipping to avoid re-uploading an already-used versionCode."
                echo "RELEASE_NOTES_SKIP=true" >> "$GITHUB_ENV"
                exit 0
              fi
              attempt=$((attempt + 1))
            done
          fi

          # Walk recent main runs of this workflow (newest first) and take
          # as the range base the head SHA of the first one whose deploy
          # job succeeded AND actually published — i.e. its Play upload
          # *step* concluded success, not just the job. A deploy concludes
          # green while publishing nothing whenever PLAY_SERVICE_ACCOUNT_JSON
          # is missing (the upload step skips), and also when
          # RELEASE_NOTES_SKIP suppressed a housekeeping-only push; treating
          # such a run as "released" would permanently drop its range's
          # commits from the next real release's notes. Skipped housekeeping
          # runs are fine to re-walk: their commits re-enter the range and
          # the prefix/path filter drops them again. The job and step names
          # below must match the `name:` values in this workflow verbatim;
          # rename them together. The current run and re-runs of the same
          # head SHA are skipped.
          prev_sha=""
          # The head SHA of the oldest run this call sees — kept so that
          # "no run has ever published" (as opposed to "the API call
          # failed") has a fallback better than BEFORE_SHA: without it, the
          # very first automated upload after any number of secretless
          # pushes would only credit the single most recent push, silently
          # dropping every commit queued during the secretless stretch
          # (Codex, PR #97 — AGENTS.md's own promise is that those commits
          # "stay queued and ship with the next real release instead of
          # being lost").
          oldest_head=""
          # 332161221 is this workflow's id before the ci.yml rename. Its runs
          # hold the last published release until one publishes under the
          # new path; drop it once that has happened.
          for WORKFLOW_REF in ci.yml 332161221; do
          while IFS=$'\t' read -r run_id run_head; do
            [ -z "$run_id" ] && continue
            [ "$run_head" = "$AFTER_SHA" ] && continue
            oldest_head="$run_head"
            # filter=all, not the default filter=latest (GitHub REST API
            # docs: "List jobs for a workflow run") — without it, a run
            # that was rerun only ever reports its most recent attempt's
            # jobs here (Codex, PR #97: interacts with the rerun guard
            # above — if attempt 1 published and attempt 2 correctly
            # skipped re-uploading via that guard, this call would see
            # only attempt 2's skip and conclude the whole run never
            # published, missing the real last-published point and
            # duplicating already-released subjects into the next
            # release's notes).
            published=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=all&per_page=100" \
              --jq '[.jobs[]
                     | select(.name == "Build and release")
                     | select(.conclusion == "success")
                     | .steps[]
                     | select(.name == "Upload to Play Store internal track")
                     | .conclusion]
                    | any(. == "success")' \
              2>/dev/null || true)
            if [ "$published" = "true" ]; then
              prev_sha="$run_head"
              break
            fi
          done < <(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_REF}/runs?branch=main&per_page=100" \
            --jq '.workflow_runs[]? | [.id, .head_sha] | @tsv' \
            2>/dev/null || true)
            if [ -n "$prev_sha" ]; then
              break
            fi
          done

          # If a later push already published, this run is superseded —
          # skip (Codex, PR #97, tenth and eleventh passes). `concurrency`
          # (this job's own `concurrency:` block, below) stops two deploys
          # from running *at once*, but GitHub's own docs say queued jobs
          # still run in the order each one *starts waiting*, not push
          # order, so an older push's deploy can reach this point after a
          # newer push already published a higher versionCode — Play's API
          # would reject the stale upload outright.
          #
          # This checks $prev_sha rather than main's raw current tip
          # (an earlier version of this check did exactly that, and Codex
          # correctly flagged it): main can advance past this run's SHA
          # without anything ever actually publishing — a later push might
          # be docs-only and start no workflow under this file's `paths`
          # filter, or its own build/screenshot-tests might fail before
          # `deploy` ever runs — and skipping in either case would strand
          # this run's otherwise-releasable commits with nothing left to
          # ship them. The only signal that this run's work is genuinely
          # already covered is $prev_sha — the head of a run that actually
          # published — descending from $AFTER_SHA.
          if [ -n "$prev_sha" ] \
             && git merge-base --is-ancestor "$AFTER_SHA" "$prev_sha" 2>/dev/null; then
            echo "A later push already published (last published SHA ${prev_sha} already includes this run's ${AFTER_SHA}); skipping."
            echo "RELEASE_NOTES_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # per_page=100 (the API max) keeps this a single call while
          # covering a 100-run red streak; --paginate would fetch the
          # workflow's entire run history on every deploy. If the last
          # success is somehow deeper than 100 runs, the BEFORE_SHA
          # fallback below still applies — same accepted trade as the
          # oldest_head fallback just below it.

          # Fallbacks, in order: the last run that actually published;
          # else the oldest run this call saw (see oldest_head's own
          # comment) — covers "no run has ever published" without
          # silently narrowing to one push; else BEFORE_SHA (API yielded
          # nothing at all — a fresh adoption run, or an API hiccup),
          # except when it's all-zeros or unreachable (first push to a
          # branch, force-reset orphaning the old tip); then HEAD alone —
          # walking the entire history would be both slow and meaningless.
          # The range walk itself is deliberately uncapped: `git log
          # --max-count` limits commits BEFORE `--reverse` applies (git
          # documents --reverse as reversing the commits already chosen),
          # so a pre-walk cap would keep the newest N and silently drop
          # the oldest — the exact commits the oldest-first notes must
          # preserve. The cap lives on qualifying subjects inside the
          # filter loop below instead; the per-commit diff-tree cost on a
          # pathologically long range (release outage) is the accepted
          # trade.
          base_sha=""
          if [ -n "$prev_sha" ] && git cat-file -e "$prev_sha" 2>/dev/null; then
            base_sha="$prev_sha"
          elif [ -n "$oldest_head" ] \
             && git rev-parse --quiet --verify "${oldest_head}^{commit}" >/dev/null; then
            # oldest_head's own commit was already scanned by a run and
            # never published, so it belongs in this release too — its
            # parent is the exclusive base the range walk below needs.
            # Falls through to oldest_head itself (dropping only that one
            # commit from the range) on the rare repo where it has no
            # parent at all.
            #
            # Known residual gap, not fixed here (Codex, PR #97, fourth
            # pass; checked against GitHub's actual workflow-run schema —
            # no `before`/range field exists anywhere on it, only the
            # single `head_sha`, so a historical run's own push boundary
            # genuinely isn't recoverable from this API): if the run that
            # produced oldest_head was itself triggered by a multi-commit
            # push, this only walks back one commit, not the whole push,
            # so earlier commits from that same push stay excluded. Bounded
            # to at most one release, one time (the first automated
            # upload), which is the same "not chasing perfection at the
            # extreme edge" trade this file already accepts for a
            # published run more than 100 runs back (see the comment
            # above this fallback chain).
            base_sha=$(git rev-parse --quiet --verify "${oldest_head}^{commit}^" 2>/dev/null || echo "$oldest_head")
          elif [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git rev-parse --quiet --verify "$BEFORE_SHA^{commit}" >/dev/null; then
            base_sha="$BEFORE_SHA"
          fi

          if [ -n "$base_sha" ]; then
            shas=$(git log --reverse --no-merges --format=%H "$base_sha..$AFTER_SHA")
          else
            shas=""
          fi
          if [ -z "$shas" ]; then
            shas=$(git log -1 --format=%H "$AFTER_SHA")
          fi

          subjects=()
          # Set only once a genuinely qualifying 51st+ commit is actually
          # found (below) — never merely on reaching the cap — independent
          # of whether the 500-char budget loop further down ever finds a
          # reason of its own to truncate: if the first 50 subjects happen
          # to fit under the char cap, that loop would otherwise never
          # learn a 51st commit existed and the published notes would read
          # as complete when they aren't (Codex, PR #97).
          cap_truncated=false
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            s=$(git log -1 --format=%s "$sha")
            case "$s" in
              ci:*)       continue ;;
              docs:*)     continue ;;
              internal:*) continue ;;
              refactor:*) continue ;;
              test:*)     continue ;;
              tests:*)    continue ;;
            esac
            relevant=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # `case` patterns match `*` against `/` too, so `.*` skips
              # any path whose first component starts with `.` — covers
              # `.github/`, `.claude/`, `.gitignore`, `.editorconfig` etc.
              # in one pattern. Every `.md` file is housekeeping here
              # (AGENTS.md) — no PRIVACY.md exception, unlike the sibling
              # repos.
              case "$f" in
                .*)   ;;
                *.md) ;;
                *)    relevant=true; break ;;
              esac
            done < <(git diff-tree --no-commit-id --name-only -r "$sha")
            if [ "$relevant" = "false" ]; then
              continue
            fi
            # Reached only for a commit that has already cleared every
            # prefix and path filter above — so a cap hit here means a
            # real qualifying commit is being discarded, not merely that
            # 50 slots filled with housekeeping still ahead in the range
            # (Codex, PR #97, second pass: the first version's check ran
            # before qualification, so a 51st sha that happened to be
            # `ci:`-prefixed or housekeeping-only still set this flag and
            # produced a false "…" even though nothing was actually cut).
            # Safety net for unusually long ranges, applied AFTER
            # oldest-first ordering so the head of the list is never
            # dropped; in practice the 500-char Play cap truncates far
            # sooner.
            if [ "${#subjects[@]}" -ge 50 ]; then
              echo "More than 50 qualifying commits in range; marking the notes truncated."
              cap_truncated=true
              break
            fi
            subjects+=("$s")
          done <<< "$shas"

          if [ "${#subjects[@]}" -eq 0 ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "No release-worthy commits, but this is a manual workflow_dispatch — publishing the current tip anyway with a generic note."
              subjects+=("Internal test build")
            else
              echo "No release-worthy commits in this push (all ci: / docs: / internal: / refactor: / test: / tests: prefixed or docs / dotfile housekeeping); skipping the Play upload."
              echo "RELEASE_NOTES_SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          MAX=500
          TRUNC_MARK=$'\n…'

          # `wc -m` counts characters under a UTF-8 locale; pin it so the
          # bullet ("• ", 1 visible char) and the ellipsis ("…", 1 char)
          # are scored as Play sees them, not as raw bytes.
          export LC_ALL=C.UTF-8

          # Always emit a "• "-bulleted line per subject — even for a
          # single qualifying commit — so the Play "What's new" card
          # always renders as a list.
          format_notes() {
            local first=1
            for s in "$@"; do
              if [ "$first" -eq 1 ]; then
                printf '%s' "• $s"
                first=0
              else
                printf '\n• %s' "$s"
              fi
            done
          }

          char_len() {
            printf '%s' "$1" | wc -m
          }

          # GNU cut -c on ubuntu-latest splits multibyte UTF-8 characters
          # mid-byte even under a UTF-8 locale (verified directly: coreutils
          # 9.4's -c is byte-indexed, not character-indexed, despite the
          # locale) — the hard-truncate fallback below needs a genuinely
          # Unicode-aware cut so it can never write invalid UTF-8 into
          # whatsnew-en-US (Codex, PR #97). Python's string indexing is by
          # Unicode code point, so this slices on character boundaries.
          truncate_chars() {
            printf '%s' "$1" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read()[:int(sys.argv[1])])' "$2"
          }

          # Truncate against the full formatted output — bullet ("• "),
          # newline separator, and the "\n…" truncation marker all count
          # toward MAX. Play's documented per-language cap is 500 Unicode
          # characters for the *entered* "What's new" text, so measuring
          # anything less risks writing whatsnew-en-US over the cap and
          # having the Play upload reject the release.
          #
          # Two-phase: (1) greedy-add subjects until the formatted output
          # (no marker yet) would exceed MAX, then (2) if any subject was
          # dropped, append the "\n…" marker so the reader can tell the
          # list was cut. The marker is load-bearing — a truncated list
          # must always end in it — so if the marker pushes us back over
          # MAX we drop trailing subjects until there is room. In the rare
          # edge case where the very first subject is 499-500 chars
          # formatted and cannot coexist with the marker, hard-truncate it.
          kept=()
          # Seeded from the 50-subject cap, not always false: if that cap
          # already discarded real commits, the marker must still appear
          # even when every kept subject happens to fit under MAX on its
          # own (Codex, PR #97) — the loop below only ever adds to this,
          # never clears it.
          truncated=$cap_truncated
          for s in "${subjects[@]}"; do
            candidate=$(format_notes "${kept[@]}" "$s")
            if [ "$(char_len "$candidate")" -gt "$MAX" ]; then
              truncated=true
              break
            fi
            kept+=("$s")
          done

          if [ "${#kept[@]}" -eq 0 ]; then
            # First subject alone exceeds the cap; hard-truncate the
            # bullet line to 499 chars and append "…".
            notes=$(truncate_chars "• ${subjects[0]}" 499)
            notes="${notes}…"
          else
            notes=$(format_notes "${kept[@]}")
            if [ "$truncated" = true ]; then
              # Drop trailing subjects until the marker fits.
              while [ "$(char_len "${notes}${TRUNC_MARK}")" -gt "$MAX" ] \
                && [ "${#kept[@]}" -gt 0 ]; do
                unset 'kept[${#kept[@]}-1]'
                notes=$(format_notes "${kept[@]}")
              done
              if [ "${#kept[@]}" -eq 0 ]; then
                # Subject 0 was 499-500 chars formatted on its own — it fit
                # in the greedy phase but couldn't coexist with the marker.
                # Hard-truncate the bullet line so the marker still has
                # room.
                notes=$(truncate_chars "• ${subjects[0]}" 498)
              fi
              notes="${notes}${TRUNC_MARK}"
            fi
          fi

          # Use a random heredoc terminator so a crafted commit subject
          # can't include the literal terminator on a line of its own and
          # inject arbitrary entries into $GITHUB_ENV.
          # https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
          delim="RELEASE_NOTES_EOF_$(openssl rand -hex 16)"
          {
            printf 'RELEASE_NOTES<<%s\n' "$delim"
            printf '%s\n' "$notes"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"

      - name: Require a release keystore
        # A push to main must end in a signed AAB. Without the keystore secret
        # every step below skips on its own condition and the job goes green
        # having built and published nothing -- indistinguishable, from the
        # outside, from a release that worked. Fail here instead, naming what
        # is missing, so a secret that was renamed, expired, or lost in a move
        # to the `production` environment is caught on the push that broke it
        # rather than the next time someone looks for a build that never came.
        #
        # Forks are exempt. They have no secrets by design, and building
        # unsigned is a supported state here -- failing their main pushes would
        # turn that into a red build. The `build` job keeps its release compile
        # in exactly that case, so R8 still runs for them.
        if: env.HAS_RELEASE_KEYSTORE != 'true' && github.event.repository.fork != true
        run: |
          echo "::error::A push to main must produce a signed AAB, but RELEASE_KEYSTORE_BASE64 is unset or empty. Set it together with RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD, or this release would publish nothing."
          exit 1

      - name: Materialize release keystore
        # Decoded whenever the keystore secret is present, so the signed AAB
        # can be downloaded from CI artifacts for the one-time manual seed
        # upload Play Console requires (docs/play-store-internal-track.md).
        # The decoded file is validated with keytool so wrong base64 or a
        # wrong password fails here with a clear error rather than at signing
        # time.
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          missing=""
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_PASSWORD" ]      && missing="$missing RELEASE_KEY_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ]         && missing="$missing RELEASE_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is set but these companion secrets are missing or empty:$missing"
            exit 1
          fi
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          if ! keytool -list -keystore "${RUNNER_TEMP}/release.keystore" -storepass "$RELEASE_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Decoded release keystore is not a valid keystore or RELEASE_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          echo "RELEASE_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"

      - name: Materialize Firebase config
        # Turns crash reporting on for the AAB that actually ships (SPEC.md
        # §12, docs/crashlytics.md). Optional like every other secret in this
        # job: without it the build still succeeds and Crashlytics stays
        # dormant — the app's own gate then reports the reporter unavailable
        # and Settings offers no switch — so a fork or a repo that has not set
        # the secret up gets a green run rather than a red one nobody reads.
        #
        # Not a credential: google-services.json ships inside every Play build
        # and identifies the project rather than authenticating to it. It is a
        # secret here only because the repo deliberately does not track it, so
        # a fork's builds cannot file crashes into this project's console.
        if: env.RELEASE_KEYSTORE_FILE != '' && env.HAS_FIREBASE_CONFIG == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          # A truncated or mis-pasted secret would otherwise fail deep inside
          # the Google Services plugin with a message about a missing client.
          # Check the two keys the plugin actually reads, so the error names
          # the secret instead.
          if ! jq -e '.project_info and .client' app/google-services.json > /dev/null; then
            echo "::error::GOOGLE_SERVICES_JSON is set but is not a valid google-services.json (no project_info/client)."
            exit 1
          fi

      - name: Build release AAB
        # Gated only on the keystore being present — a signed AAB is useful on
        # its own (a downloadable artifact for the seed upload). The release
        # signingConfig only attaches when all four RELEASE_KEYSTORE_* /
        # RELEASE_KEY_* variables are set (app/build.gradle.kts), which the
        # decode step above guarantees whenever it sets RELEASE_KEYSTORE_FILE —
        # it fails first if any of the other three is empty. Without them Play
        # would reject the AAB anyway.
        #
        # The `play` flavor only: it is the only flavor any Play track ships
        # (SPEC.md §3.4) — `direct` is the sideload/F-Droid fallback and has
        # no Play listing to upload to.
        if: env.RELEASE_KEYSTORE_FILE != ''
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew :app:bundlePlayRelease

      - name: Upload signed AAB as workflow artifact
        # Downloadable from the Actions UI for the one-time manual seed
        # upload to Play Console, and for re-uploading a release by hand.
        if: env.RELEASE_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Compose Play Store release notes
        # The upload-google-play action takes a directory of whatsnew-<locale>
        # files. The bulleted list of qualifying commit subjects was already
        # built upstream by "Build release notes" (and truncated to Play's
        # 500-character per-locale cap); this step just writes it to disk in
        # the layout the action expects. When that earlier step set
        # RELEASE_NOTES_SKIP=true (every commit in the push was housekeeping)
        # the gate below skips this and the upload step.
        if: |
          env.RELEASE_KEYSTORE_FILE != '' &&
          env.HAS_PLAY_SA == 'true' &&
          env.RELEASE_NOTES_SKIP != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/whatsnew"
          printf '%s' "${RELEASE_NOTES}" \
            > "${RUNNER_TEMP}/whatsnew/whatsnew-en-US"
          echo "PLAY_WHATSNEW_DIR=${RUNNER_TEMP}/whatsnew" >> "${GITHUB_ENV}"

      - name: Check the Data Safety declaration covers crash reporting
        # A feature-based gate, not a permission-based one (maintainer,
        # 2026-08-25): what matters is whether *crash reporting is on in this
        # build*, not whether the manifest happens to hold a permission.
        #
        # The hazard it closes: the moment GOOGLE_SERVICES_JSON is set, the
        # next push to main builds a reporting-enabled AAB and the step below
        # publishes it — while the Play Data Safety form may still say "no data
        # collected". That is a policy violation the pipeline would be
        # automating, not a stale doc (docs/play-store-declarations.md, TODO.md).
        #
        # So publishing a reporting-enabled build additionally requires the
        # repository variable PLAY_DATA_SAFETY_DECLARED to be "true", set by
        # hand once the Console form actually carries crash logs, diagnostics
        # and device or other IDs. Builds with reporting dormant are unaffected,
        # and the signed AAB is still produced and uploaded as an artifact
        # either way — so the device checks TODO.md owes are not blocked.
        #
        # Skips loudly rather than failing: a red main on every push until a
        # variable is set is noise, but a silent skip would look like a
        # successful release. The warning names what to do.
        if: env.RELEASE_KEYSTORE_FILE != '' && env.HAS_PLAY_SA == 'true'
        env:
          DATA_SAFETY_DECLARED: ${{ vars.PLAY_DATA_SAFETY_DECLARED }}
        run: |
          set -euo pipefail
          if [ "${HAS_FIREBASE_CONFIG}" != "true" ]; then
            echo "Crash reporting is dormant in this build; the old Data Safety answer still holds."
            exit 0
          fi
          if [ "${DATA_SAFETY_DECLARED}" = "true" ]; then
            echo "Data Safety declared as covering crash reporting; publishing allowed."
            exit 0
          fi
          echo "PLAY_UPLOAD_BLOCKED=true" >> "${GITHUB_ENV}"
          echo "::warning::Not publishing to Play: this build has crash reporting enabled, but the repository variable PLAY_DATA_SAFETY_DECLARED is not \"true\". Update the Play Console Data Safety form to declare crash logs, diagnostics and device or other IDs (docs/play-store-declarations.md), then set that variable. The signed AAB is still attached to this run as an artifact."

      - name: Upload to Play Store internal track
        # Gated so it only runs with both the upload key and service account
        # configured. Also skipped when "Build release notes" set
        # RELEASE_NOTES_SKIP=true — no Play-worthy "What's new" entry exists,
        # so shipping a release would be redundant — and when the step above
        # found crash reporting enabled without the Data Safety declaration
        # confirmed. See docs/play-store-internal-track.md for the Play Console
        # / service account setup this depends on.
        if: |
          env.RELEASE_KEYSTORE_FILE != '' &&
          env.HAS_PLAY_SA == 'true' &&
          env.RELEASE_NOTES_SKIP != 'true' &&
          env.PLAY_UPLOAD_BLOCKED != 'true'
        uses: r0adkll/upload-google-play@a80b0bcdcfdfcc2d026f2bc73f726760b2cbc967  # post-v1.1.5: fixes DEP0040/DEP0169 Node.js deprecation warnings
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.snoozemo
          releaseFiles: app/build/outputs/bundle/playRelease/app-play-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ env.PLAY_WHATSNEW_DIR }}
