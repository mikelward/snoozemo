# Translated from this repo's former hand-synced shell lane-classification
# script (its is_housekeeping()/LANE_PREFIXES/dispatch_without_pr_ok(),
# deleted in this migration) -- replaced here by the shared mikelward/lanes
# engine.
#
# Ordered: the FIRST matching rule wins, and anything matching no rule is
# code. The module trees (app/, core/, dnd/, presence/, tile/) are build
# inputs whatever the extension, so they are code. dev-docs/ is the
# developer-docs folder (state models, diagrams) and rides the docs lane
# whole -- its markdown and the rendered SVGs beside it alike. Markdown
# anywhere else rides docs too; everything else, images included, stays
# code.
# This is deliberately a folder allowlist, not a repo-wide image rule.
# Routing images repo-wide would put docs/play-store/*.png -- the Play
# graphics PlayStoreGraphicsScreenshotTest regenerates and the screenshot
# job drift-checks on every PR (ci.yml, "Fail on stale Play Store
# graphics") -- on a lane that skips that job, so an icon change could ship
# a stale store graphic unvalidated. Keeping the allowlist to dev-docs/
# means anything CI validates stays code by default, with no carve-out to
# forget.
# docs/PRIVACY.md is ordinary docs like the rest of docs/ -- Play's "What's
# new" is a store-listing field a user installing an update never sees at
# update time, so forcing a wording-only PRIVACY.md change through the code
# lane never bought real visibility, only heavier CI (TODO.md). Order
# matters: the module trees are checked before the general markdown rule, or
# a file under one of them would ride the docs lane before the more specific
# rule ever got a chance to say otherwise.
# `**` -- not `*` -- because path.matchesGlob's `*` never crosses `/`, unlike
# the bash `case` patterns the retired script used for the same rule.
code app/**
code core/**
code dnd/**
code presence/**
code tile/**
docs dev-docs/**
docs **/*.md

# This repo's commit-subject conventions for housekeeping commits (see
# AGENTS.md "Commit messages"). Every commit riding the docs lane must carry one.
prefixes ci docs internal refactor test tests

# The retired shell script never checked the PR title, only commit subjects -- kept off
# here too, so this migration doesn't silently add a new requirement an
# in-flight PR's title was never held to. Worth revisiting separately.
lint-title no

# ci.yml's workflow_dispatch has one caller -- the screenshot job's
# refresh step, which always names its PR (the input is required) -- so a
# PR-less dispatch is never legitimate here, on any ref.
# Classify a push to main by the range it added, rather than by a paths
# filter on the trigger that restates these rules in another language.
push classify

dispatch-without-pr refuse
