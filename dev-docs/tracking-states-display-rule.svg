polygon points="175,0 350,-175 175,-350 0,-175" class="label-container" transform="translate(-174.5, 175)"/><g class="label" style="" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Is a more-specific end than the<br />8h failsafe running?<br />chosen timer, or Wi-Fi grace</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S-3" data-look="classic" transform="translate(138, 659.9375)"><rect class="basic label-container" style="" x="-130" y="-87" width="260" height="174"/><g class="label" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Show that countdown, and name it:<br />a time chosen, or 'Wi-Fi lost'.<br />Still name any exit also armed.</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-C-5" data-look="classic" transform="translate(441.9375, 659.9375)"><polygon points="123.9375,0 247.875,-123.9375 123.9375,-247.875 0,-123.9375" class="label-container" transform="translate(-123.4375, 123.9375)"/><g class="label" style="" transform="translate(-84.9375, -24)"><rect/><foreignObject width="169.875" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="nodeLabel"><p>Is a departure or motion<br />exit being watched?</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-N-7" data-look="classic" transform="translate(286.9375, 920.875)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" heigh